# Settings for pytest, the tool that runs the tests in tests/.
# Run everything from the repo root with:  python -m pytest
[pytest]
# Only look for tests in the tests/ folder (not in the lab's own scripts)
testpaths = tests
# Let tests import both the lab's modules (".", e.g. `import config`) and
# the test helpers ("tests", e.g. `import musim_runner`)
pythonpath = . tests
